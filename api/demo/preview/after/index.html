</style></head><body><div data-wx-tag="view" data-wxml-line="1" data-wxml-source="pages/index/index.wxml" class="page" id="index-page"><div data-wx-tag="view" data-wxml-line="2" data-wxml-source="pages/index/index.wxml" class="header" id="index-header"><span data-wx-tag="text" data-wxml-line="3" data-wxml-source="pages/index/index.wxml" class="title" id="index-title">青囊靶场 · 医院预约挂号</span><button data-wx-tag="button" data-wxml-line="4" data-wxml-source="pages/index/index.wxml" class="scan-btn" id="btn-scan" data-bindtap="onScan" aria-label="扫码"><img data-wx-tag="image" data-wxml-line="4" data-wxml-source="pages/index/index.wxml" role="presentation" class="scan-icon" src="../../miniapp-assets/scan.svg"></button></div><div data-wx-tag="view" data-wxml-line="6" data-wxml-source="pages/index/index.wxml" class="notice" id="index-notice"><span data-wx-tag="text" data-wxml-line="7" data-wxml-source="pages/index/index.wxml" class="notice-text" id="notice-text">温馨提示：请携带身份证原件，按预约时段提前30分钟到院取号</span></div><div data-wx-tag="view" data-wxml-line="9" data-wxml-source="pages/index/index.wxml" class="search" id="index-search"><span data-wx-tag="text" data-wxml-line="10" data-wxml-source="pages/index/index.wxml" class="search-label" id="search-label">搜索医院</span><input data-wx-tag="input" data-wxml-line="11" data-wxml-source="pages/index/index.wxml" class="search-input" id="search-input" aria-label="输入医院名称搜索" placeholder="请输入医院名称"><span data-wx-tag="text" data-wxml-line="12" data-wxml-source="pages/index/index.wxml" class="hint-text" id="hint-text">可输入医院简称，例如“示范医院”</span></div><div data-wx-tag="view" data-wxml-line="14" data-wxml-source="pages/index/index.wxml" class="hosp-list" id="hosp-list"><button data-wx-tag="button" data-wxml-line="15" data-wxml-source="pages/index/index.wxml" class="hosp-card" id="hosp-1" data-bindtap="goDept"><span data-wx-tag="text" data-wxml-line="16" data-wxml-source="pages/index/index.wxml" class="hosp-name" id="hosp-1-name">青囊示范医院（虚构）</span><span data-wx-tag="text" data-wxml-line="17" data-wxml-source="pages/index/index.wxml" class="hosp-meta" id="hosp-1-meta">三级 · 越秀区</span></button><button data-wx-tag="button" data-wxml-line="19" data-wxml-source="pages/index/index.wxml" class="hosp-card" id="hosp-2" data-bindtap="goDept"><span data-wx-tag="text" data-wxml-line="20" data-wxml-source="pages/index/index.wxml" class="hosp-name" id="hosp-2-name">望舒社区医院（虚构）</span><span data-wx-tag="text" data-wxml-line="21" data-wxml-source="pages/index/index.wxml" class="hosp-meta" id="hosp-2-meta">二级 · 海珠区</span></button></div></div>
<style id="carelens-demo-bridge-style">
  .__cl_highlight {
    outline: 3px solid #e11d48 !important;
    outline-offset: 2px !important;
    box-shadow: 0 0 0 6px rgba(225, 29, 72, 0.22) !important;
    animation: __clPulse 1.1s ease-in-out infinite alternate;
    position: relative;
  }
  .__cl_sr_active {
    outline: 3px solid #0284c7 !important;
    outline-offset: 2px !important;
    box-shadow: 0 0 0 6px rgba(2, 132, 199, 0.28) !important;
  }
  .__cl_sr_badge {
    position: fixed;
    z-index: 99999;
    background: #0284c7;
    color: #fff;
    font-size: 12px;
    font-weight: 700;
    padding: 3px 8px;
    border-radius: 999px;
    pointer-events: none;
    box-shadow: 0 2px 8px rgba(0,0,0,0.28);
    max-width: 310px;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }
  @keyframes __clPulse {
    from { box-shadow: 0 0 0 3px rgba(225, 29, 72, 0.22); }
    to { box-shadow: 0 0 0 8px rgba(225, 29, 72, 0.36); }
  }
  body.__cl_elderly_sim {
    filter: blur(0.65px) contrast(0.84) saturate(0.82);
  }
  #__cl_toast {
    position: fixed;
    left: 14px;
    right: 14px;
    bottom: 14px;
    z-index: 99998;
    background: rgba(15, 23, 42, 0.94);
    color: #ffffff;
    font-size: 13px;
    line-height: 1.45;
    padding: 10px 12px;
    border-radius: 10px;
    box-shadow: 0 6px 18px rgba(15, 23, 42, 0.28);
    display: none;
  }
  .__cl_alt_verified {
    margin-top: 8px;
    padding: 8px 10px;
    border-radius: 6px;
    background: #ecfdf5;
    border: 1px solid #10b981;
    color: #065f46;
    font-size: 14px;
    line-height: 1.4;
  }
  #slider-area.__cl_slider_done {
    background: #dcfce7 !important;
    border: 1px solid #16a34a;
  }
</style>
<div id="__cl_toast" role="status" aria-live="polite"></div>
<script>
(function() {
  const VARIANT = "after";
  const PAGE = "index";
  let toastTimer = null;
  let badgeEl = null;

  function showToast(msg) {
    const t = document.getElementById('__cl_toast');
    if (!t) return;
    t.textContent = msg;
    t.style.display = 'block';
    clearTimeout(toastTimer);
    toastTimer = setTimeout(() => { t.style.display = 'none'; }, 3400);
  }

  function clearHighlights() {
    document.querySelectorAll('.__cl_highlight').forEach(el => el.classList.remove('__cl_highlight'));
  }

  function clearSr() {
    document.querySelectorAll('.__cl_sr_active').forEach(el => el.classList.remove('__cl_sr_active'));
    if (badgeEl && badgeEl.parentNode) badgeEl.parentNode.removeChild(badgeEl);
    badgeEl = null;
  }

  function isVisible(el) {
    if (!el) return false;
    const style = window.getComputedStyle(el);
    if (style.display === 'none' || style.visibility === 'hidden') return false;
    const rect = el.getBoundingClientRect();
    return rect.width > 0 && rect.height > 0;
  }

  function setModalVisible(show) {
    const mask = document.getElementById('notice-modal-mask');
    if (!mask) return;
    mask.style.display = show ? 'flex' : 'none';
    window.parent.postMessage({ type: 'carelens:modalState', open: !!show, variant: VARIANT, page: PAGE }, '*');
  }

  // Collect screen-reader focusable / key accessibility items strictly in DOM order
  function collectSrOrder() {
    const mask = document.getElementById('notice-modal-mask');
    const modalOpen = mask && window.getComputedStyle(mask).display !== 'none';
    const root = modalOpen ? document.getElementById('notice-modal') : document.body;
    if (!root) return [];

    const selector = [
      'button',
      'input',
      '[data-bindtap]',
      '[role="button"]',
      '[data-wx-tag="movable-area"]',
      '.status-dot'
    ].join(',');

    const nodes = Array.from(root.querySelectorAll(selector)).filter(el => isVisible(el));
    return nodes.map((el, idx) => {
      const tag = el.tagName.toLowerCase();
      const wxTag = el.getAttribute('data-wx-tag') || tag;
      const ariaLabel = (el.getAttribute('aria-label') || '').trim();
      const role = (el.getAttribute('role') || '').trim();
      const placeholder = (el.getAttribute('placeholder') || '').trim();
      const text = (el.innerText || el.textContent || '').replace(/\s+/g, ' ').trim();
      const cs = window.getComputedStyle(el);
      const cssOrder = parseInt(cs.order || '0', 10) || 0;

      let spoken = '';
      let diag = '';
      let isDefect = false;

      if (el.id === 'btn-scan' && !ariaLabel && !text) {
        spoken = '未命名按钮（读屏无法告知用途！）';
        diag = 'D05：button 内仅图标无 aria-label，视障者不知道这是扫码按钮';
        isDefect = true;
      } else if (el.classList.contains('status-dot') && !ariaLabel) {
        spoken = '（空白元素：读屏可能跳过，仅靠红绿圆点区分有号/约满）';
        diag = 'D11：仅用颜色传递信息，色弱/全盲无法分辨有号或约满';
        isDefect = true;
      } else if (tag === 'div' && el.getAttribute('data-bindtap') === 'pickSlot' && role !== 'button') {
        spoken = '文本：' + text + '（警告：无 button 语义，部分读屏不提示可点击！）';
        diag = 'D10：<view bindtap> 未加 role="button"，视障用户不知道可以点选该号源';
        isDefect = true;
      } else if (tag === 'input' && !ariaLabel) {
        spoken = '输入框，占位提示：' + (placeholder || '无') + '（开始输入后提示消失，无固定标签）';
        diag = 'D12：仅靠 placeholder，没有可见标签或 aria-label';
        isDefect = true;
      } else if (el.id === 'slider-area') {
        spoken = ariaLabel ? ('验证区域：' + ariaLabel) : '自定义滑块区域（非标准控件，无法用键盘/读屏单指完成拖动）';
        diag = VARIANT === 'before'
          ? 'D08：必须拖动滑块验证，无短信/语音替代通道'
          : '已保留滑块并增加下方短信/语音验证替代按钮（演示占位）';
        isDefect = VARIANT === 'before';
      } else if (el.id === 'btn-submit' && cssOrder > 0) {
        spoken = '按钮：' + (ariaLabel || text) + '【异常！DOM排第1，视觉被CSS order推到最底】';
        diag = 'D09：焦点顺序错乱！视障用户刚进页面还没核对信息、没输身份证就先读到“提交预约”';
        isDefect = true;
      } else if (el.id === 'modal-close') {
        const rect = el.getBoundingClientRect();
        const small = rect.width < 44 || rect.height < 44;
        spoken = '按钮：' + (ariaLabel || text) + (small ? '（触控区仅 ' + Math.round(rect.width) + '×' + Math.round(rect.height) + 'px，极易误触）' : '');
        diag = small ? 'D07：关闭按钮仅 16×16px 贴右上角，老人很难点中' : 'D07 已修复：关闭区扩大至 44×44px 并新增底部“我知道了”大按钮';
        isDefect = small;
      } else if (el.classList.contains('icon-item')) {
        const hasVisibleText = text.length > 0;
        spoken = '按钮：' + (ariaLabel || text) + (hasVisibleText ? '' : '（屏幕无可见文字，仅读屏有 aria-label）');
        diag = hasVisibleText ? 'D06 已修复：图标下方已补充清晰可见文字' : 'D06：纯图标无可见文字，低视力老人看不懂图标含义';
        isDefect = !hasVisibleText;
      } else {
        const roleLabel = (tag === 'button' || role === 'button') ? '按钮' : (tag === 'input' ? '输入框' : '元素');
        spoken = roleLabel + '：' + (ariaLabel || text || placeholder || el.id);
        diag = '语义与顺序正常';
      }

      return {
        index: idx,
        id: el.id || ('item-' + idx),
        wxTag,
        label: ariaLabel || text || placeholder || el.id,
        spoken,
        diag,
        isDefect,
        cssOrder
      };
    });
  }

  function focusSrStep(stepIdx) {
    clearSr();
    const mask = document.getElementById('notice-modal-mask');
    const modalOpen = mask && window.getComputedStyle(mask).display !== 'none';
    const root = modalOpen ? document.getElementById('notice-modal') : document.body;
    const selector = 'button,input,[data-bindtap],[role="button"],[data-wx-tag="movable-area"],.status-dot';
    const nodes = root ? Array.from(root.querySelectorAll(selector)).filter(el => isVisible(el)) : [];
    const items = collectSrOrder();
    if (!nodes.length || stepIdx < 0 || stepIdx >= nodes.length) {
      window.parent.postMessage({ type: 'carelens:srInfo', variant: VARIANT, page: PAGE, items, activeIndex: -1 }, '*');
      return;
    }
    const target = nodes[stepIdx];
    target.classList.add('__cl_sr_active');
    target.scrollIntoView({ behavior: 'smooth', block: 'center' });
    const rect = target.getBoundingClientRect();
    badgeEl = document.createElement('div');
    badgeEl.className = '__cl_sr_badge';
    badgeEl.textContent = '读屏第 ' + (stepIdx + 1) + '/' + nodes.length + ' 步：' + items[stepIdx].label;
    badgeEl.style.left = Math.max(8, Math.min(rect.left, 70)) + 'px';
    badgeEl.style.top = Math.max(8, rect.top - 28) + 'px';
    document.body.appendChild(badgeEl);
    window.parent.postMessage({ type: 'carelens:srInfo', variant: VARIANT, page: PAGE, items, activeIndex: stepIdx }, '*');
  }

  // Wire interactive miniapp actions
  document.addEventListener('click', function(ev) {
    const el = ev.target.closest('[data-bindtap]');
    if (!el) return;
    const action = el.getAttribute('data-bindtap');
    if (action === 'goDept') {
      window.parent.postMessage({ type: 'carelens:navigate', page: 'departments' }, '*');
    } else if (action === 'goDoctors') {
      window.parent.postMessage({ type: 'carelens:navigate', page: 'doctors' }, '*');
    } else if (action === 'pickSlot') {
      window.parent.postMessage({ type: 'carelens:navigate', page: 'confirm' }, '*');
    } else if (action === 'goBack') {
      window.parent.postMessage({ type: 'carelens:navigate', page: 'doctors' }, '*');
    } else if (action === 'closeModal') {
      setModalVisible(false);
      showToast('已关闭挂号须知弹窗（可点击右侧工具栏重新打开对比关闭按钮大小）');
    } else if (action === 'onScan') {
      const noLabel = !el.getAttribute('aria-label');
      showToast(noLabel
        ? '扫码按钮点击：修复前无 aria-label，视障读屏只能读出“按钮”'
        : '扫码按钮点击：修复后已补齐 aria-label="扫码"');
    } else if (action === 'onFav') {
      const cur = el.textContent.trim();
      el.textContent = cur === '☆' ? '★' : '☆';
      showToast(VARIANT === 'before'
        ? '收藏点击：修复前热区仅 30×30px，手指偏一点就点不中'
        : '收藏点击：修复后热区已扩至 44×44px');
    } else if (action === 'onAltVerify') {
      const vb = document.getElementById('verify-block');
      if (vb && !vb.querySelector('.__cl_alt_verified')) {
        const note = document.createElement('div');
        note.className = '__cl_alt_verified';
        note.textContent = '✓ 已切换至短信验证码/语音验证替代入口（演示占位：实际需接入医院认证接口）';
        vb.appendChild(note);
      }
      showToast('已启用无障碍替代验证通道（替代拖动滑块）');
    } else if (action === 'onSubmit') {
      showToast('🛡️ 安全护栏（stop_before_submit）：本地演示拦截提交，不向外部发请求');
      window.parent.postMessage({ type: 'carelens:submitIntercepted' }, '*');
    }
  });

  // Interactive slider drag/click feedback on confirm page
  const sliderArea = document.getElementById('slider-area');
  const sliderHandle = document.getElementById('slider-handle');
  if (sliderArea && sliderHandle) {
    let dragging = false;
    let startX = 0;
    sliderHandle.addEventListener('pointerdown', (e) => {
      dragging = true;
      startX = e.clientX;
      sliderHandle.setPointerCapture(e.pointerId);
    });
    sliderHandle.addEventListener('pointermove', (e) => {
      if (!dragging) return;
      const maxDx = Math.max(40, sliderArea.clientWidth - sliderHandle.clientWidth);
      const dx = Math.max(0, Math.min(maxDx, e.clientX - startX));
      sliderHandle.style.left = dx + 'px';
      if (dx >= maxDx - 6) {
        sliderArea.classList.add('__cl_slider_done');
        sliderHandle.textContent = '✓';
      }
    });
    sliderHandle.addEventListener('pointerup', () => {
      dragging = false;
      if (!sliderArea.classList.contains('__cl_slider_done')) {
        sliderHandle.style.left = '0px';
        showToast('滑块未拖到最右已回弹——手抖老人或读屏用户极难完成该操作！');
      } else {
        showToast('滑块拖动成功（但全盲用户仍无法用读屏单指拖过去）');
      }
    });
  }

  window.addEventListener('message', function(ev) {
    const d = ev.data || {};
    if (d.type === 'highlight') {
      clearHighlights();
      const ids = Array.isArray(d.ids) ? d.ids : [];
      if (PAGE === 'doctors' && ids.length) {
        const modalIds = new Set(['modal-close', 'modal-close-ok', 'notice-modal']);
        const needsModal = ids.some(id => modalIds.has(id));
        setModalVisible(needsModal);
      }
      let firstEl = null;
      ids.forEach(id => {
        const el = document.getElementById(id);
        if (el) {
          el.classList.add('__cl_highlight');
          if (!firstEl) firstEl = el;
        }
      });
      if (firstEl) {
        firstEl.scrollIntoView({ behavior: 'smooth', block: 'center' });
      }
    } else if (d.type === 'clearHighlight') {
      clearHighlights();
    } else if (d.type === 'elderlyFilter') {
      document.body.classList.toggle('__cl_elderly_sim', !!d.enabled);
    } else if (d.type === 'toggleModal') {
      setModalVisible(!!d.show);
    } else if (d.type === 'srQueryOrder') {
      const items = collectSrOrder();
      window.parent.postMessage({ type: 'carelens:srInfo', variant: VARIANT, page: PAGE, items, activeIndex: -1 }, '*');
    } else if (d.type === 'srFocusStep') {
      focusSrStep(Number(d.index || 0));
    } else if (d.type === 'srReset') {
      clearSr();
    }
  });

  // Report ready + initial SR order
  window.addEventListener('DOMContentLoaded', function() {
    const mask = document.getElementById('notice-modal-mask');
    const modalOpen = !!(mask && window.getComputedStyle(mask).display !== 'none');
    window.parent.postMessage({
      type: 'carelens:ready',
      variant: VARIANT,
      page: PAGE,
      modalOpen,
      items: collectSrOrder()
    }, '*');
  });
})();
</script>
